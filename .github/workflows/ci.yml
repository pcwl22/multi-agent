name: Verify RepoPilot
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit-and-integration:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
          cache: pip
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m ruff check .
      - run: python -m pytest -q
  docker-end-to-end:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps -e .
      - run: docker build -t repopilot-sandbox:local -f sandbox/Dockerfile .
      - run: python -m pytest tests/e2e -q
        env:
          REPOPILOT_RUN_DOCKER_TESTS: '1'

  live-repair-contract:
    if: startsWith(github.base_ref, 'validation/expired-token-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t repopilot-sandbox:local -f sandbox/Dockerfile .
      - run: >-
          docker run --rm --network=none --user=65534:65534 --read-only
          --cap-drop=ALL --security-opt=no-new-privileges --pids-limit=64
          --cpus=1 --memory=512m --log-driver=none
          --tmpfs /tmp:rw,noexec,nosuid,size=64m
          -v "${{ github.workspace }}/validation_repository:/workspace:ro"
          -w /workspace -e PYTHONPATH=/workspace repopilot-sandbox:local
          python -m pytest tests -q -p no:cacheprovider
